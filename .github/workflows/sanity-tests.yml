name: mip-sanity-data regression suite

# Solves every instance in the `test/mip-sanity-data` submodule with the
# freshly-built `cbc`, validates each saved solution (feasibility,
# integrality, objective, optimality/infeasibility vs the trusted
# best-known-solution reference) via `test/cbc_validate_sol`, and fails the
# build on any violation. Runs whenever `next` changes (push or PR), so
# regressions are caught immediately after a build.
#
# Build engine: reuses the `config` (configure+build+install) and `package`
# (relocatable bundling) scripts from h-g-s/cbc-workspace, same convention as
# next-release.yml. Runs across the same 5 platforms next-release.yml
# packages (Linux x86_64/aarch64, macOS arm64/x86_64, Windows x86_64), using
# the exact same container/toolchain/config flags per platform, so a release
# binary is never shipped without having actually solved+validated the full
# mip-sanity-data suite on that platform first.
#
# Crucially, each job runs `./package` exactly as next-release.yml does and
# then points `run-mip-sanity-tests --cbc=` at the *packaged*, relocatable
# `cbc` binary (extracted from the tarball/zip, patchelf/install_name_tool
# rpath-rewritten and all) rather than the raw in-tree `src/cbc` build
# output. This means the suite exercises the literal artifact bytes that
# next-release.yml would upload/ship, catching any packaging-induced
# regression (e.g. a bad rpath rewrite or a missing bundled runtime
# dependency) that a plain in-tree build would never see. The validator/C-API
# test harnesses (cbc_validate_sol, mip-c-solve, ...) are still built in-tree
# against ../src/libCbc.la — they are internal test tooling, not part of the
# shipped release, and package intentionally strips lib/pkgconfig from the
# bundle so they cannot be linked against the packaged tree anyway.
#
# The Linux x86_64 job builds inside the same quay.io/pypa/manylinux_2_34
# container + gcc-toolset-14 compiler as next-release.yml's official Linux
# x86_64 release build, for the same reason as before: there is no point
# validating a binary built by a different compiler/environment than the one
# we actually ship. The actual test orchestration
# (`test/run-mip-sanity-tests`) is self-contained in this repo.

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:

concurrency:
  group: sanity-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Branch of the sibling COIN-OR repos to build Cbc `next` against.
  DEP_REF: next
  # h-g-s/cbc-workspace ref providing the `config`/`package` scripts.
  WORKSPACE_REF: main

jobs:
  linux-x86_64:
    name: Linux x86_64 (manylinux_2_34)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/Cbc
          submodules: true   # fetches test/mip-sanity-data

      - name: Checkout sibling COIN-OR repos + cbc-workspace scripts
        run: |
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/CoinUtils work/CoinUtils
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Osi work/Osi
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Clp work/Clp
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Cgl work/Cgl
          git clone --depth 1 --branch "$WORKSPACE_REF" https://github.com/h-g-s/cbc-workspace work/cbc-workspace
          cp work/cbc-workspace/config work/cbc-workspace/package work/

      - name: Build + package + test inside manylinux_2_34 (same container/compiler/flags as next-release.yml)
        run: |
          for i in 1 2 3; do
            docker pull quay.io/pypa/manylinux_2_34_x86_64 && break
            echo "Attempt $i failed, retrying in 30s..."; sleep 30
          done
          docker run --rm -v "$PWD/work:/work" -w /work quay.io/pypa/manylinux_2_34_x86_64 bash -c '
            set -euo pipefail
            source /opt/rh/gcc-toolset-14/enable 2>/dev/null || true
            dnf install -y --setopt=install_weak_deps=False \
              openblas-devel suitesparse-devel zlib-devel gcc-gfortran \
              patchelf rsync pkgconfig epel-release >/dev/null
            dnf install -y --setopt=install_weak_deps=False parallel >/dev/null
            ./config --opt --arch=generic --install --prefix=/work/install --jobs="$(nproc)" \
              --lapack --amd --zlib --no-bz2 --no-nauty
            ./package --prefix=/work/install --name=cbc-linux-x86_64-next --out=/work/dist
            mkdir -p /work/packaged && tar -xzf /work/dist/cbc-linux-x86_64-next.tar.gz -C /work/packaged
            cd Cbc/test
            ./run-mip-sanity-tests --jobs="$(nproc)" --no-color --prefix=/work/install \
              --cbc=/work/packaged/cbc-linux-x86_64-next/bin/cbc
          '

      - name: Fix ownership of container-written files
        if: always()
        run: sudo chown -R "$USER:$USER" work

      - name: Upload logs/solutions on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-results-linux-x86_64
          path: work/Cbc/test/sanity-results/

  linux-aarch64:
    name: Linux aarch64 (manylinux_2_34)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/Cbc
          submodules: true   # fetches test/mip-sanity-data

      - name: Checkout sibling COIN-OR repos + cbc-workspace scripts
        run: |
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/CoinUtils work/CoinUtils
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Osi work/Osi
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Clp work/Clp
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Cgl work/Cgl
          git clone --depth 1 --branch "$WORKSPACE_REF" https://github.com/h-g-s/cbc-workspace work/cbc-workspace
          cp work/cbc-workspace/config work/cbc-workspace/package work/

      - name: Build + package + test inside manylinux_2_34_aarch64
        run: |
          for i in 1 2 3; do
            docker pull quay.io/pypa/manylinux_2_34_aarch64 && break
            echo "Attempt $i failed, retrying in 30s..."; sleep 30
          done
          docker run --rm -v "$PWD/work:/work" -w /work quay.io/pypa/manylinux_2_34_aarch64 bash -c '
            set -euo pipefail
            source /opt/rh/gcc-toolset-14/enable 2>/dev/null || true
            dnf install -y --setopt=install_weak_deps=False \
              openblas-devel suitesparse-devel zlib-devel gcc-gfortran \
              patchelf rsync pkgconfig epel-release >/dev/null
            dnf install -y --setopt=install_weak_deps=False parallel >/dev/null
            ./config --opt --arch=generic --install --prefix=/work/install --jobs="$(nproc)" \
              --lapack --amd --zlib --no-bz2 --no-nauty
            ./package --prefix=/work/install --name=cbc-linux-aarch64-next --out=/work/dist
            mkdir -p /work/packaged && tar -xzf /work/dist/cbc-linux-aarch64-next.tar.gz -C /work/packaged
            cd Cbc/test
            ./run-mip-sanity-tests --jobs="$(nproc)" --no-color --prefix=/work/install \
              --cbc=/work/packaged/cbc-linux-aarch64-next/bin/cbc
          '

      - name: Fix ownership of container-written files
        if: always()
        run: sudo chown -R "$USER:$USER" work

      - name: Upload logs/solutions on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-results-linux-aarch64
          path: work/Cbc/test/sanity-results/

  macos-arm64:
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/Cbc
          submodules: true   # fetches test/mip-sanity-data

      - name: Checkout sibling COIN-OR repos + cbc-workspace scripts
        run: |
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/CoinUtils work/CoinUtils
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Osi work/Osi
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Clp work/Clp
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Cgl work/Cgl
          git clone --depth 1 --branch "$WORKSPACE_REF" https://github.com/h-g-s/cbc-workspace work/cbc-workspace
          cp work/cbc-workspace/config work/cbc-workspace/package work/

      - name: Install Homebrew build deps
        run: |
          # `flock` and a modern `bash` aren't present by default on macOS:
          # run-mip-sanity-tests needs GNU/util-linux-style flock for its
          # progress-counter locking, and macOS's ancient system /bin/bash
          # (3.2, last GPLv2 release) has a longstanding `set -u` bug where
          # `${empty_array[@]}` throws "unbound variable" instead of
          # expanding to nothing — fixed only in bash 4.4+. Both are
          # sidestepped by installing Homebrew's `flock` and `bash` and
          # invoking the script with the latter explicitly (see below).
          brew install gcc openblas suite-sparse pkg-config parallel flock bash

      - name: Build + package + test
        working-directory: work
        run: |
          # Use Homebrew's gcc/gfortran so config's Homebrew-aware detection
          # picks Homebrew's OpenBLAS/SuiteSparse instead of Apple clang's.
          GCC_PREFIX="$(brew --prefix gcc)"
          GCC_BIN="$(ls "$GCC_PREFIX"/bin/gcc-* | head -1)"
          GXX_BIN="$(ls "$GCC_PREFIX"/bin/g++-* | head -1)"
          FC_BIN="$(ls "$GCC_PREFIX"/bin/gfortran* | head -1)"
          export CC="$GCC_BIN" CXX="$GXX_BIN" FC="$FC_BIN"
          ./config --opt --arch=generic --install --prefix="$PWD/install" --jobs="$(sysctl -n hw.ncpu)" \
            --lapack --amd --zlib --no-bz2 --no-nauty
          ./package --prefix="$PWD/install" --name=cbc-macos-arm64-next --out=dist
          mkdir -p packaged && tar -xzf dist/cbc-macos-arm64-next.tar.gz -C packaged
          cd Cbc/test
          "$(brew --prefix bash)/bin/bash" ./run-mip-sanity-tests --jobs="$(sysctl -n hw.ncpu)" --no-color \
            --prefix="$PWD/../../install" --cbc="$PWD/../../packaged/cbc-macos-arm64-next/bin/cbc"

      - name: Upload logs/solutions on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-results-macos-arm64
          path: work/Cbc/test/sanity-results/

  macos-x86_64:
    name: macOS x86_64 (Intel, via Rosetta)
    # GitHub-hosted dedicated Intel macOS runners (macos-13) have become
    # extremely capacity-constrained (jobs can sit queued for hours and never
    # get scheduled). Instead, run on a plentiful Apple Silicon runner and
    # cross-build for x86_64 under Rosetta 2, same approach as
    # next-release.yml. Since we need Homebrew's OpenBLAS/SuiteSparse/gcc for
    # x86_64 specifically (not just Apple's universal clang + Accelerate
    # framework), this requires its own, separate x86_64 Homebrew prefix
    # under /usr/local (the arm64 runner's native Homebrew lives under
    # /opt/homebrew and only has arm64 bottles).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/Cbc
          submodules: true   # fetches test/mip-sanity-data

      - name: Checkout sibling COIN-OR repos + cbc-workspace scripts
        run: |
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/CoinUtils work/CoinUtils
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Osi work/Osi
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Clp work/Clp
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Cgl work/Cgl
          git clone --depth 1 --branch "$WORKSPACE_REF" https://github.com/h-g-s/cbc-workspace work/cbc-workspace
          cp work/cbc-workspace/config work/cbc-workspace/package work/

      - name: Install Rosetta 2 + x86_64 Homebrew
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          if [[ ! -x /usr/local/bin/brew ]]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
          fi
          # `flock` and a modern `bash` aren't present by default on macOS:
          # run-mip-sanity-tests needs GNU/util-linux-style flock for its
          # progress-counter locking, and macOS's ancient system /bin/bash
          # (3.2, last GPLv2 release) has a longstanding `set -u` bug where
          # `${empty_array[@]}` throws "unbound variable" instead of
          # expanding to nothing — fixed only in bash 4.4+. Both are
          # sidestepped by installing Homebrew's `flock` and `bash` and
          # invoking the script with the latter explicitly (see below).
          arch -x86_64 /usr/local/bin/brew install gcc openblas suite-sparse pkg-config parallel flock bash

      - name: Build + package + test (under Rosetta)
        working-directory: work
        run: |
          arch -x86_64 /bin/bash <<'ROSETTA'
          set -euo pipefail
          eval "$(/usr/local/bin/brew shellenv)"
          GCC_PREFIX="$(brew --prefix gcc)"
          GCC_BIN="$(ls "$GCC_PREFIX"/bin/gcc-* | head -1)"
          GXX_BIN="$(ls "$GCC_PREFIX"/bin/g++-* | head -1)"
          FC_BIN="$(ls "$GCC_PREFIX"/bin/gfortran* | head -1)"
          export CC="$GCC_BIN" CXX="$GXX_BIN" FC="$FC_BIN"
          ./config --opt --arch=generic --install --prefix="$PWD/install" --jobs="$(sysctl -n hw.ncpu)" \
            --lapack --amd --zlib --no-bz2 --no-nauty
          ./package --prefix="$PWD/install" --name=cbc-macos-x86_64-next --out=dist
          mkdir -p packaged && tar -xzf dist/cbc-macos-x86_64-next.tar.gz -C packaged
          cd Cbc/test
          "$(brew --prefix bash)/bin/bash" ./run-mip-sanity-tests --jobs="$(sysctl -n hw.ncpu)" --no-color \
            --prefix="$PWD/../../install" --cbc="$PWD/../../packaged/cbc-macos-x86_64-next/bin/cbc"
          ROSETTA

      - name: Upload logs/solutions on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-results-macos-x86_64
          path: work/Cbc/test/sanity-results/

  windows-x86_64:
    name: Windows x86_64 (MinGW64)
    runs-on: windows-latest
    # MSYSTEM=MINGW64 makes config.guess return x86_64-w64-mingw32 (instead of
    # x86_64-pc-msys), so libtool/configure produce genuine Windows DLLs linked
    # only against system DLLs — not msys-2.0.dll-dependent cygwin-style ones.
    env:
      MSYSTEM: MINGW64
      CHERE_INVOKING: "1"
      DEP_REF: next
      WORKSPACE_REF: main
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/Cbc
          submodules: true   # fetches test/mip-sanity-data

      - name: Install MinGW64 toolchain + deps
        run: |
          pacman-key --init
          pacman-key --populate msys2
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-gcc-fortran \
            mingw-w64-x86_64-openblas \
            mingw-w64-x86_64-suitesparse \
            mingw-w64-x86_64-zlib \
            mingw-w64-x86_64-pkg-config \
            make git rsync zip unzip parallel

      - name: Checkout sibling COIN-OR repos + cbc-workspace scripts
        run: |
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/CoinUtils work/CoinUtils
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Osi work/Osi
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Clp work/Clp
          git clone --depth 1 --branch "$DEP_REF" https://github.com/coin-or/Cgl work/Cgl
          git clone --depth 1 --branch "$WORKSPACE_REF" https://github.com/h-g-s/cbc-workspace work/cbc-workspace
          cp work/cbc-workspace/config work/cbc-workspace/package work/

      - name: Build + package + test
        run: |
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          cd work
          ./config --opt --arch=generic --install --prefix="$PWD/install" --jobs="$(nproc)" \
            --lapack --amd --zlib --no-bz2 --no-nauty
          ./package --prefix="$PWD/install" --name=cbc-windows-x86_64-next --out=dist
          mkdir -p packaged && unzip -q dist/cbc-windows-x86_64-next.zip -d packaged
          cd Cbc/test
          ./run-mip-sanity-tests --jobs="$(nproc)" --no-color \
            --prefix="$PWD/../../install" --cbc="$PWD/../../packaged/cbc-windows-x86_64-next/bin/cbc.exe"

      - name: Upload logs/solutions on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-results-windows-x86_64
          path: work/Cbc/test/sanity-results/
